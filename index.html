<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raffy Bio Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      background: rgba(99, 102, 241, 0.25);
      filter: blur(120px);
      top: -100px;
      right: -100px;
      z-index: 0;
    }

    .bg-glow2 {
      position: fixed;
      width: 400px;
      height: 400px;
      background: rgba(236, 72, 153, 0.2);
      filter: blur(100px);
      bottom: -120px;
      left: -100px;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 2;
    }

    .card {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 35px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
      animation: fadeUp 0.8s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .username {
      color: #cbd5e1;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #e2e8f0;
      margin-bottom: 30px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-btn {
      text-decoration: none;
      color: white;
      padding: 16px 20px;
      border-radius: 18px;
      font-weight: 600;
      font-size: 1rem;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(12px);
    }

    .link-btn:hover {
      transform: translateY(-4px) scale(1.02);
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }

    .link-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.2),
        transparent
      );
      transition: 0.5s;
    }

    .link-btn:hover::before {
      left: 100%;
    }

    .footer {
      margin-top: 28px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 24px;
    }

    .socials a {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255,255,255,0.08);
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
      transition: 0.3s ease;
    }

    .socials a:hover {
      transform: scale(1.12);
      background: rgba(255,255,255,0.16);
    }

    @media (max-width: 500px) {
      .card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 1.7rem;
      }

      .link-btn {
        padding: 14px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>
  <div class="bg-glow2"></div>

  <div class="container">
    <div class="card">

      <img
        src="https://i.imgur.com/2DhmtJ4.jpeg"
        alt="Profile Picture"
        class="avatar"
      />

      <h1>Raffy</h1>
      <p class="username">@raffyonrblx</p>

      <p class="bio">
        <br>
        Welcome to my official bio page.
      </p>

 <div class="links">

        <a href="https://robiox.com.ve/games/8737602449/PLS-DONATE?privateServerLinkCode=26145525399286926000412737965059" target="_blank" class="link-btn">
          🎮 Please Donate Private Server
        </a>

        <a href="https://roblox.com.ki/communities/6438558335/" target="_blank" class="link-btn">
          📺 Roblox Group
        </a>

        <a href="https://discord.com/" target="_blank" class="link-btn">
          💬 Discord Server
        </a>

        <a href="https://roblox.com.ug/users/6438558335/profile" target="_blank" class="link-btn">
          📸 Roblox Profile
        </a>

        <a href="https://github.com/" target="_blank" class="link-btn">
          🔥 Latest Project
        </a>

      </div>

      <div class="socials">
        <a href="#">🎮</a>
        <a href="#">📺</a>
        <a href="#">💬</a>
        <a href="#">📸</a>
      </div>

      <div class="footer">
        Made with HTML & CSS ✨
      </div>

    </div>
  </div>

</body>
</html>
